<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <!-- v999 fb#469 & #471 iOS Safari 対策: input focus 時 の auto-zoom を 抑止。
       maximum-scale=1 は 現代 iOS では accessibility の ため ユーザ 手動 の ピンチズーム は
       依然 効く (Apple は accessibility 目的 で user gesture を 尊重)、 focus zoom だけ 止まる。 -->
  <meta name="theme-color" content="#4a106d">
  <!-- iOS Safari auto-detects 8+ digit numbers as phone numbers; JAN codes get linkified
       and tapping them prompts "call this number?". Disable globally. -->
  <meta name="format-detection" content="telephone=no, address=no, email=no">
  <title>LabPay</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LabPay">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="topbar" hidden>
    <a href="#/" class="brand">LabPay <span class="brand-version" id="brand-version" style="cursor:pointer" title="バージョン履歴">v999</span></a>
    <script type="module">
      import { showVersionHistory } from '/js/version_history.js';
      document.getElementById('brand-version')?.addEventListener('click', (ev) => {
        ev.preventDefault(); ev.stopPropagation();
        showVersionHistory();
      });
    </script>
    <div class="topbar-right">
      <a href="#/notifications" class="bell" id="bell-link">
        通知<span id="unread-badge" class="badge" hidden>0</span>
      </a>
      <a href="#/settings">設定</a>
      <a href="#/admin" id="admin-link" hidden>管理</a>
      <a href="#/feedback-admin" id="feedback-admin-link" hidden>FB</a>
      <span class="topbar-sep" aria-hidden="true" id="topbar-sep" hidden></span>
      <a href="#/feedback" id="feedback-link">フィードバック</a>
    </div>
  </header>

  <nav id="tabs" hidden>
    <a href="#/"             data-tab-id="home">ホーム</a>
    <a href="#/groups"       data-tab-id="groups" id="tab-groups" hidden>グループ</a>
    <a href="#/sns"          data-tab-id="sns">らぼったー</a>
    <a href="#/buy"          data-tab-id="buy">購入</a>
    <a href="#/sell"         data-tab-id="sell">販売</a>
    <a href="#/requests-hub" data-tab-id="requests">依頼</a>
    <a href="#/auctions"     data-tab-id="auctions">競売</a>
    <a href="#/research"     data-tab-id="research">研究</a>
    <a href="#/shared"       data-tab-id="shared">共有</a>
    <a href="#/lab-mgmt"     data-tab-id="lab-mgmt">運営</a>
    <a href="#/games"        data-tab-id="games">娯楽</a>
    <a href="#/apps"         data-tab-id="apps">アプリ</a>
    <a href="#/achievements" data-tab-id="achievements">実績</a>
  </nav>

  <!-- v500 #113 #114 起動中は中身が空なので、 最初に大きくバージョンを出して
       「ちゃんと起動してるよ」 を伝える。 app.js が hydrate したら自動で上書きされる。
       (app.innerHTML = ... が走ると消える) -->
  <main id="app">
    <div id="splash" style="text-align:center; padding:80px 16px 24px; color:#4a106d; font-family:system-ui, -apple-system, sans-serif">
      <div style="font-size:36px; font-weight:700; letter-spacing:0.05em">LabPay <span style="color:#7b3fa0" id="splash-ver">v999</span></div>
      <div style="font-size:12px; color:#666; margin-top:8px" id="splash-updated">最終更新: 取得中…</div>
      <div style="margin-top:30px">
        <div style="width:30px; height:30px; border:3px solid #ede4f3; border-top-color:#4a106d; border-radius:50%; margin:0 auto; animation:splash-spin 1s linear infinite"></div>
      </div>
      <div style="font-size:11px; color:#999; margin-top:14px">読み込み中...</div>
    </div>
    <style>@keyframes splash-spin { to { transform: rotate(360deg); } }</style>
  </main>

  <div id="install-banner" hidden>
    <span class="install-text">アプリとしてホーム画面に追加できます</span>
    <button id="install-btn" type="button">追加する</button>
    <button id="install-close" type="button" aria-label="閉じる">×</button>
  </div>

  <div id="toast" hidden></div>

  <script type="module" src="/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
        // v911 #378 新 シェル が deploy された 時 に 自動 リロード し 新 app.js / 新 ルート
        //   を 取り込む。 初回 install で SW の controller が 付く ケース で 無限 ループ に
        //   なら ない よう、 既に controller が ある = 既存 セッション の 時 だけ reload。
        // v999 従来 は SW 更新 が 走った 瞬間 に 即 location.reload() して 「他 メニュー
        //   に 移動 した 直後 に 戻される / 重い」 症状 が あった。 修正:
        //   (a) 初期 ハッシュ (= 移動前) だった 場合 のみ reload。 既に 移動 済 なら reload
        //       せず、 タブ 切替 で 隠れた タイミング に defer。
        //   (b) 5 秒 の 猶予 を 挟んで から reload (ネットワーク や SW install の 揺れ で
        //       ユーザ 操作 中 に 即発火 して しまう の を 抑制)。
        if (navigator.serviceWorker.controller) {
          const initialHash = location.hash || '#/';
          const doReload = () => {
            if (window.__labpay_reloaded_for_sw) return;
            window.__labpay_reloaded_for_sw = true;
            location.reload();
          };
          const scheduleReload = () => {
            const curHash = location.hash || '#/';
            if (curHash !== initialHash) {
              // 既に 移動 済み → タブ が 隠れた タイミング で defer
              document.addEventListener('visibilitychange', () => {
                if (document.hidden) doReload();
              }, { once: true });
            } else {
              // 初期 位置 のまま → 5 秒 遅延 で リロード (連続 更新 の 揺れ 対策)
              setTimeout(doReload, 5000);
            }
          };
          navigator.serviceWorker.addEventListener('controllerchange', scheduleReload);
        }
      });
    }
  </script>
</body>
</html>
