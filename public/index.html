<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <!-- v1003 fb#469 & #471 iOS Safari 対策: input focus 時の auto-zoom を抑止。
       maximum-scale=1 は現代 iOS では accessibility のためユーザ手動のピンチズームは
       依然効く (Apple は accessibility 目的で user gesture を尊重)、 focus zoom だけ止まる。 -->
  <meta name="theme-color" content="#4a106d">
  <!-- iOS Safari auto-detects 8+ digit numbers as phone numbers; JAN codes get linkified
       and tapping them prompts "call this number?". Disable globally. -->
  <meta name="format-detection" content="telephone=no, address=no, email=no">
  <title>LabPay</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LabPay">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/css/style.css">
  <!-- v1265 fb#490 バージョン履歴クリックを堅牢化。 index.html だけで完結する
       非モジュールインラインスクリプトにハンドラ本体を置くことで、
       (a) module import タイミング race を完全に避ける
       (b) sw キャッシュ状態に関係なく button parse 済み時点で
           window.__lpVersionClick が必ず存在
       (c) window.showVersionHistory が未定義でも dynamic import で拾える
       (d) それでも駄目なら alert で可視化 → 「クリックしても何も起きない」を撲滅 -->
  <script>
  window.__lpVersionClick = function(ev) {
    if (ev && ev.preventDefault) ev.preventDefault();
    if (ev && ev.stopPropagation) ev.stopPropagation();
    var invoke = function(fn){
      try { fn(); } catch (e) { alert('バージョン履歴の表示中にエラーが発生しました: ' + (e && e.message || e)); }
    };
    if (typeof window.showVersionHistory === 'function') {
      invoke(window.showVersionHistory);
      return false;
    }
    // window.showVersionHistory が未セット → 動的 import で拾う。 SW precache 対象なので通常キャッシュ即応。
    import('/js/version_history.js')
      .then(function(m){
        if (m && typeof m.showVersionHistory === 'function') { invoke(m.showVersionHistory); }
        else { alert('バージョン履歴モジュールに showVersionHistory が見つかりませんでした'); }
      })
      .catch(function(e){
        alert('バージョン履歴の読み込みに失敗しました: ' + (e && e.message || e));
      });
    return false;
  };
  </script>
</head>
<body>
  <header id="topbar" hidden>
    <!-- v1265 fb#490 バージョンクリック修正 (v1156 では GitHub フォールバックだったが
         リポは private なので中村さん指摘で撤退)。 button に戻し、 onclick で <head> 側の
         window.__lpVersionClick を呼ぶ単純構造に。モジュール import が走らないので
         SW キャッシュや読み込み race に一切依存しない。 -->
    <span class="brand"><a href="#/" style="text-decoration:none; color:inherit">LabPay</a>
      <button type="button" class="brand-version" id="brand-version" title="バージョン履歴"
              onclick="return window.__lpVersionClick(event)">v1265</button></span>
    <div class="topbar-right">
      <a href="#/notifications" class="bell" id="bell-link">
        通知<span id="unread-badge" class="badge" hidden>0</span>
      </a>
      <a href="#/settings">設定</a>
      <a href="#/admin" id="admin-link" hidden>管理</a>
      <a href="#/feedback-admin" id="feedback-admin-link" hidden>FB</a>
      <span class="topbar-sep" aria-hidden="true" id="topbar-sep" hidden></span>
      <a href="#/feedback" id="feedback-link">フィードバック</a>
    </div>
  </header>

  <!-- v1265 タブは js/app.js の TAB_DEFS を single source of truth に、
       applyTabLayout() の中で動的生成 (rebuildNav) するので nav の中身は空。 -->
  <nav id="tabs" hidden></nav>

  <!-- v500 #113 #114 起動中は中身が空なので、最初に大きくバージョンを出して
       「ちゃんと起動してるよ」を伝える。 app.js が hydrate したら自動で上書きされる。
       (app.innerHTML = ... が走ると消える) -->
  <main id="app">
    <div id="splash" style="text-align:center; padding:80px 16px 24px; color:#4a106d; font-family:system-ui, -apple-system, sans-serif">
      <div style="font-size:36px; font-weight:700; letter-spacing:0.05em">LabPay <span style="color:#7b3fa0" id="splash-ver">v1265</span></div>
      <div style="font-size:12px; color:#666; margin-top:8px" id="splash-updated">最終更新: 取得中…</div>
      <div style="margin-top:30px">
        <div style="width:30px; height:30px; border:3px solid #ede4f3; border-top-color:#4a106d; border-radius:50%; margin:0 auto; animation:splash-spin 1s linear infinite"></div>
      </div>
      <div style="font-size:11px; color:#999; margin-top:14px">読み込み中...</div>
    </div>
    <style>@keyframes splash-spin { to { transform: rotate(360deg); } }</style>
  </main>

  <div id="install-banner" hidden>
    <span class="install-text">アプリとしてホーム画面に追加できます</span>
    <button id="install-btn" type="button">追加する</button>
    <button id="install-close" type="button" aria-label="閉じる">×</button>
  </div>

  <div id="toast" hidden></div>

  <script type="module" src="/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
        // v911 #378 新シェルが deploy された時に自動リロードし新 app.js / 新ルート
        //   を取り込む。初回 install で SW の controller が付くケースで無限ループに
        //   ならないよう、既に controller がある = 既存セッションの時だけ reload。
        // v1003 中村さん指摘「ホームで2回ロードしてしまうところある」の主因は
        //   controllerchange 後の 5s 自動 reload。 SW 更新は次回起動時に自然に反映される
        //   ので、 UI操作中の強制 reload は完全撤廃。タブが隠れた瞬間にだけ defer reload
        //   する形に (バックグラウンドでは目立たないので体感二重ロードにならない)。
        if (navigator.serviceWorker.controller) {
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (window.__labpay_reloaded_for_sw) return;
            // タブが「隠れた」瞬間だけ 1 回 reload。表示中の reload は出さない。
            const onHide = () => {
              if (document.hidden && !window.__labpay_reloaded_for_sw) {
                window.__labpay_reloaded_for_sw = true;
                location.reload();
              }
            };
            document.addEventListener('visibilitychange', onHide, { once: true });
          });
        }
      });
    }
  </script>
</body>
</html>
