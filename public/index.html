<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#4a106d">
  <!-- iOS Safari auto-detects 8+ digit numbers as phone numbers; JAN codes get linkified
       and tapping them prompts "call this number?". Disable globally. -->
  <meta name="format-detection" content="telephone=no, address=no, email=no">
  <title>LabPay</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LabPay">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="topbar" hidden>
    <a href="#/" class="brand">LabPay <span class="brand-version">v71</span></a>
    <div class="topbar-right">
      <a href="#/notifications" class="bell" id="bell-link">
        通知<span id="unread-badge" class="badge" hidden>0</span>
      </a>
      <a href="#/admin" id="admin-link" hidden>管理</a>
      <a href="#/settings">設定</a>
    </div>
  </header>

  <nav id="tabs" hidden>
    <a href="#/">ホーム</a>
    <a href="#/buy">購入</a>
    <a href="#/sell">販売</a>
    <a href="#/tasks">タスク</a>
    <a href="#/achievements">実績</a>
    <a href="#/network">関係</a>
  </nav>

  <main id="app"></main>

  <div id="install-banner" hidden>
    <span class="install-text">アプリとしてホーム画面に追加できます</span>
    <button id="install-btn" type="button">追加する</button>
    <button id="install-close" type="button" aria-label="閉じる">×</button>
  </div>

  <div id="toast" hidden></div>

  <script type="module" src="/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
