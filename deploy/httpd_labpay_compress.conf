# v505 LabPay HTTP 応答に brotli / gzip 圧縮を有効化。
# 効果: home.js (103KB) / groups.js (217KB) などが 1/4 程度に縮み、 起動の白画面時間を
# 大幅に削減。 Cache-Control / ETag は既存設定のまま。
#
# 配置: /etc/httpd/conf.d/labpay_compress.conf に置く (Include される)
# 反映: systemctl reload httpd

<IfModule mod_brotli.c>
    AddOutputFilterByType BROTLI_COMPRESS \
        text/html \
        text/plain \
        text/css \
        text/xml \
        text/javascript \
        application/javascript \
        application/x-javascript \
        application/json \
        application/manifest+json \
        application/xml \
        image/svg+xml \
        font/ttf \
        font/otf
    BrotliCompressionQuality 5
</IfModule>

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE \
        text/html \
        text/plain \
        text/css \
        text/xml \
        text/javascript \
        application/javascript \
        application/x-javascript \
        application/json \
        application/manifest+json \
        application/xml \
        image/svg+xml \
        font/ttf \
        font/otf
    DeflateCompressionLevel 5
</IfModule>
