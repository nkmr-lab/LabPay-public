# v511 HTTP/2 (h2) を SSL の VirtualHost で有効化。
# HTTP/1.1 のままだと ブラウザの 6 並列上限で home の 14 並列 fetch が
# 直列化される ことが原因で 「ウィジェットが上から順に出る」 現象が起きていた。
# Protocols h2 http/1.1 を仕掛けると HTTP/2 が ALPN で交渉され、
# 同一接続で 多重化される。
#
# 配置: /etc/httpd/conf.d/labpay_http2.conf
# 反映: systemctl reload httpd

<IfModule mod_http2.c>
    Protocols h2 h2c http/1.1
    H2Push off
    H2MaxSessionStreams 100
</IfModule>
